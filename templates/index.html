<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do App</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding-top: 50px;
        }
        .todo-container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            overflow: hidden;
        }
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }
        .todo-item {
            transition: all 0.3s ease;
            border-left: 4px solid #667eea;
        }
        .todo-item:hover {
            transform: translateX(5px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        .priority-high {
            border-left-color: #dc3545;
        }
        .priority-medium {
            border-left-color: #ffc107;
        }
        .priority-low {
            border-left-color: #28a745;
        }
        .completed .todo-description {
            text-decoration: line-through;
            color: #6c757d;
        }
        .completed {
            opacity: 0.6;
        }
        .btn-add {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            color: white;
        }
        .btn-add:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
            color: white;
        }
    </style>
</head>
<body>
    <div class="todo-container">
        <div class="header">
            <h1>📝 My To-Do List</h1>
            <p class="mb-0">Manage your tasks efficiently</p>
        </div>
        
        <div class="p-4">
            <!-- Add Todo Form -->
            <div class="card mb-4">
                <div class="card-body">
                    <form id="addTodoForm" class="row g-3 align-items-center">
                        <div class="col-md-8">
                            <input type="text" class="form-control" id="newDescription" placeholder="What needs to be done?" required>
                        </div>
                        <div class="col-md-2">
                            <select class="form-select" id="newPriority">
                                <option value="high">High Priority</option>
                                <option value="medium" selected>Medium Priority</option>
                                <option value="low">Low Priority</option>
                            </select>
                        </div>
                        <div class="col-md-2">
                            <button type="submit" class="btn btn-add w-100">Add</button>
                        </div>
                    </form>
                </div>
            </div>

            <!-- Todo List -->
            <div id="todoList">
                {% for todo in todos %}
                <div class="card mb-2 todo-item priority-{{ todo.priority }} {% if todo.completed %}completed{% endif %}" data-id="{{ todo.id }}">
                    <div class="card-body p-3">
                        <div class="d-flex justify-content-between align-items-center mb-2">
                            <span class="badge bg-{{ 'danger' if todo.priority == 'high' else 'warning' if todo.priority == 'medium' else 'success' }} me-2">
                                {{ todo.priority|upper }}
                            </span>
                            <button class="btn btn-sm btn-outline-secondary toggle-btn" data-id="{{ todo.id }}">
                                {% if todo.completed %}↩️{% else %}✅{% endif %}
                            </button>
                        </div>
                        <p class="todo-description mb-1">{{ todo.description }}</p>
                        <small class="text-muted">Created: {{ todo.created_at }}</small>
                        <div class="mt-2 d-flex gap-2">
                            <button class="btn btn-sm btn-outline-primary edit-btn" data-id="{{ todo.id }}">Edit</button>
                            <button class="btn btn-sm btn-outline-danger delete-btn" data-id="{{ todo.id }}">Delete</button>
                        </div>
                    </div>
                </div>
                {% else %}
                <div class="text-center py-5">
                    <p class="text-muted">No todos yet. Add one above!</p>
                </div>
                {% endfor %}
            </div>
        </div>
    </div>

    <!-- Edit Modal -->
    <div class="modal fade" id="editModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Edit Todo</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="editForm">
                        <input type="hidden" id="editId">
                        <div class="mb-3">
                            <label class="form-label">Description</label>
                            <input type="text" class="form-control" id="editDescription" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Priority</label>
                            <select class="form-select" id="editPriority">
                                <option value="high">High Priority</option>
                                <option value="medium">Medium Priority</option>
                                <option value="low">Low Priority</option>
                            </select>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-primary" id="saveEditBtn">Save Changes</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Delete Confirmation Modal -->
    <div class="modal fade" id="deleteModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Confirm Delete</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <p>Are you sure you want to delete this todo?</p>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-danger" id="confirmDeleteBtn">Delete</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        let currentEditId = null;
        let currentDeleteId = null;

        // Add Todo
        document.getElementById('addTodoForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const description = document.getElementById('newDescription').value.trim();
            const priority = document.getElementById('newPriority').value;

            try {
                const response = await fetch('/api/todos', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ description, priority })
                });

                if (response.ok) {
                    document.getElementById('addTodoForm').reset();
                    loadTodos();
                } else {
                    alert('Failed to create todo');
                }
            } catch (error) {
                console.error('Error:', error);
            }
        });

        // Save Edit
        document.getElementById('saveEditBtn').addEventListener('click', async () => {
            const id = parseInt(document.getElementById('editId').value);
            const description = document.getElementById('editDescription').value.trim();
            const priority = document.getElementById('editPriority').value;

            try {
                const response = await fetch(`/api/todos/${id}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ description, priority })
                });

                if (response.ok) {
                    bootstrap.Modal.getInstance(document.getElementById('editModal')).hide();
                    loadTodos();
                } else {
                    alert('Failed to update todo');
                }
            } catch (error) {
                console.error('Error:', error);
            }
        });

        // Confirm Delete
        document.getElementById('confirmDeleteBtn').addEventListener('click', async () => {
            const id = currentDeleteId;
            try {
                const response = await fetch(`/api/todos/${id}`, { method: 'DELETE' });
                if (response.ok) {
                    bootstrap.Modal.getInstance(document.getElementById('deleteModal')).hide();
                    loadTodos();
                } else {
                    alert('Failed to delete todo');
                }
            } catch (error) {
                console.error('Error:', error);
            }
        });

        // Load Todos
        async function loadTodos() {
            try {
                const response = await fetch('/api/todos');
                const todos = await response.json();
                
                const list = document.getElementById('todoList');
                if (todos.length === 0) {
                    list.innerHTML = '<div class="text-center py-5"><p class="text-muted">No todos yet. Add one above!</p></div>';
                    return;
                }

                list.innerHTML = todos.map(todo => `
                    <div class="card mb-2 todo-item priority-${todo.priority} ${todo.completed ? 'completed' : ''}" data-id="${todo.id}">
                        <div class="card-body p-3">
                            <div class="d-flex justify-content-between align-items-center mb-2">
                                <span class="badge bg-${todo.priority === 'high' ? 'danger' : todo.priority === 'medium' ? 'warning' : 'success'} me-2">${todo.priority.toUpperCase()}</span>
                                <button class="btn btn-sm btn-outline-secondary toggle-btn" data-id="${todo.id}">
                                    ${todo.completed ? '↩️' : '✅'}
                                </button>
                            </div>
                            <p class="todo-description mb-1">${escapeHtml(todo.description)}</p>
                            <small class="text-muted">Created: ${todo.created_at}</small>
                            <div class="mt-2 d-flex gap-2">
                                <button class="btn btn-sm btn-outline-primary edit-btn" data-id="${todo.id}">Edit</button>
                                <button class="btn btn-sm btn-outline-danger delete-btn" data-id="${todo.id}">Delete</button>
                            </div>
                        </div>
                    </div>
                `).join('');

                // Attach event listeners to newly created elements
                document.querySelectorAll('.toggle-btn').forEach(btn => {
                    btn.addEventListener('click', async (e) => {
                        const id = parseInt(e.target.dataset.id);
                        try {
                            const response = await fetch(`/api/todos/${id}/toggle`, { method: 'POST' });
                            if (response.ok) loadTodos();
                        } catch (error) { console.error('Error:', error); }
                    });
                });

                document.querySelectorAll('.edit-btn').forEach(btn => {
                    btn.addEventListener('click', async (e) => {
                        const id = parseInt(e.target.dataset.id);
                        try {
                            const response = await fetch(`/api/todos/${id}`);
                            const todo = await response.json();
                            currentEditId = id;
                            document.getElementById('editId').value = id;
                            document.getElementById('editDescription').value = todo.description;
                            document.getElementById('editPriority').value = todo.priority;
                            const modal = new bootstrap.Modal(document.getElementById('editModal'));
                            modal.show();
                        } catch (error) { console.error('Error:', error); }
                    });
                });

                document.querySelectorAll('.delete-btn').forEach(btn => {
                    btn.addEventListener('click', async (e) => {
                        const id = parseInt(e.target.dataset.id);
                        currentDeleteId = id;
                        const modal = new bootstrap.Modal(document.getElementById('deleteModal'));
                        modal.show();
                    });
                });
            } catch (error) {
                console.error('Error loading todos:', error);
            }
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Initial load
        loadTodos();
    </script>
</body>
</html>
